<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';">
  <title>GroupShuffle</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img class="logo" src="../assets/icon.png" alt="">
    <div>
      <h1>GroupShuffle</h1>
      <p class="sub" data-i18n="app.subtitle"></p>
    </div>
    <button class="btn ghost lang" id="btnLang" type="button" data-i18n="lang.toggle"></button>
  </header>

  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2><span class="step">1</span><span data-i18n="section.input"></span></h2>
        <div class="head-actions">
          <span class="stat" id="lineStat"></span>
          <button class="btn ghost" id="btnImport" type="button" data-i18n="btn.import"></button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" wrap="off" data-i18n-placeholder="input.placeholder"></textarea>
      <div class="collapsed-input" id="collapsedInput" hidden>
        <div class="collapsed-head">
          <strong id="collapsedText"></strong>
          <span class="hint" data-i18n="collapsed.hint"></span>
          <button class="btn mini" id="btnExpand" type="button" data-i18n="btn.expand"></button>
        </div>
        <div class="vlist preview" id="previewList"><div class="vpad"></div></div>
      </div>
      <div class="drop-hint" id="dropHint" data-i18n="drop.hint"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2><span class="step">2</span><span data-i18n="section.groups"></span></h2>
      </div>
      <div class="row">
        <div class="seg" id="seg">
          <button type="button" data-k="2"></button>
          <button type="button" data-k="3" class="on"></button>
          <button type="button" data-k="4"></button>
          <button type="button" data-k="5"></button>
        </div>
        <label class="custom">
          <span data-i18n="custom.label"></span>
          <input id="kInput" type="number" min="1" max="1000" step="1" value="3">
          <span data-i18n="custom.unit"></span>
        </label>
      </div>
      <div class="row actions">
        <button class="btn primary" id="btnRun" type="button" data-i18n="btn.run"></button>
        <button class="btn" id="btnClear" type="button" data-i18n="btn.clear"></button>
        <label class="check"><input type="checkbox" id="optIndex"><span data-i18n="opt.index"></span></label>
        <label class="check"><input type="checkbox" id="optWrap" checked><span data-i18n="opt.wrap"></span></label>
        <span class="hint" data-i18n="hint.shortcut"></span>
      </div>
    </section>

    <section class="panel results" id="resultPanel" hidden>
      <div class="panel-head">
        <h2><span class="step">3</span><span data-i18n="section.results"></span></h2>
        <div class="head-actions">
          <span class="stat" id="resultStat"></span>
          <button class="btn ghost" id="btnExportAll" type="button" data-i18n="btn.exportAll"></button>
        </div>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
