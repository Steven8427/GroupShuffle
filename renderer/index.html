<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';">
  <title>GroupShuffle</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img class="logo" src="../assets/icon.png" alt="">
    <h1>GroupShuffle</h1>

    <div class="langpick" id="langPick">
      <button class="langbtn" id="btnLang" type="button"
              aria-haspopup="true" aria-expanded="false" data-i18n-title="lang.label">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
          <path d="M3.3 9h17.4M3.3 15h17.4"></path>
        </svg>
        <span class="langname" id="langName"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m7 10 5 5 5-5"></path>
        </svg>
      </button>
      <div class="langmenu" id="langMenu" role="menu" hidden></div>
    </div>
  </header>

  <!-- 语言菜单里选中项的对勾，由 app.js 克隆 -->
  <template id="tplTick">
    <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m5 13 4.5 4.5L19 7"></path>
    </svg>
  </template>

  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2><span class="step">1</span><span data-i18n="section.input"></span></h2>
        <div class="head-actions">
          <span class="stat" id="lineStat"></span>
          <button class="btn ghost" id="btnImport" type="button" data-i18n="btn.import"></button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" wrap="off" data-i18n-placeholder="input.placeholder"></textarea>
      <div class="collapsed-input" id="collapsedInput" tabindex="0" hidden>
        <div class="collapsed-head">
          <strong id="collapsedText"></strong>
          <span class="hint" data-i18n="collapsed.hint"></span>
          <button class="btn mini" id="btnCopyAll" type="button" data-i18n="btn.copyAll"></button>
          <button class="btn mini" id="btnExpand" type="button" data-i18n="btn.expand"></button>
        </div>
        <div class="vlist preview" id="previewList"><div class="vpad"></div></div>
        <!-- 折叠后没有真正的文本框，用这条提示让用户看出这里还能继续粘 -->
        <div class="paste-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="3" width="8" height="4" rx="1"></rect>
            <path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"></path>
          </svg>
          <span data-i18n="collapsed.pasteHere"></span>
        </div>
      </div>
      <div class="drop-hint" id="dropHint" data-i18n="drop.hint"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2><span class="step">2</span><span data-i18n="section.groups"></span></h2>
      </div>
      <div class="row">
        <div class="seg" id="seg">
          <button type="button" data-k="2"></button>
          <button type="button" data-k="3" class="on"></button>
          <button type="button" data-k="4"></button>
          <button type="button" data-k="5"></button>
        </div>
        <label class="custom">
          <span data-i18n="custom.label"></span>
          <input id="kInput" type="number" min="1" max="1000" step="1" value="3">
          <span data-i18n="custom.unit"></span>
        </label>
      </div>
      <div class="row actions">
        <button class="btn primary" id="btnRun" type="button" data-i18n="btn.run"></button>
        <button class="btn" id="btnClear" type="button" data-i18n="btn.clear"></button>
        <label class="check"><input type="checkbox" id="optIndex"><span data-i18n="opt.index"></span></label>
        <label class="check"><input type="checkbox" id="optWrap" checked><span data-i18n="opt.wrap"></span></label>
        <span class="hint" data-i18n="hint.shortcut"></span>
      </div>
    </section>

    <section class="panel results" id="resultPanel" hidden>
      <div class="panel-head">
        <h2><span class="step">3</span><span data-i18n="section.results"></span></h2>
        <div class="head-actions">
          <span class="stat" id="resultStat"></span>
          <button class="btn ghost" id="btnExportAll" type="button" data-i18n="btn.exportAll"></button>
        </div>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
